spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

google:
  maps:
    api:
      url: ${GOOGLE_MAPS_API_URL:https://maps.googleapis.com}
      path: ${GOOGLE_MAPS_API_PATH:/maps/api/geocode/json}
      key: ${GOOGLE_MAPS_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

localidade:
  pendente:
    reprocessamento:
      enabled: ${LOCALIDADE_PENDENTE_REPROCESSAMENTO_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
