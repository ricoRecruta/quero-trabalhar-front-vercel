spring:
  main:
    # Vercel containers must open $PORT in roughly 30 seconds. Defer
    # repository/service initialization until the first request so Tomcat is
    # ready while Neon wakes up and Hibernate prepares the schema.
    lazy-initialization: true
  datasource:
    # Vercel Marketplace/Neon provides PGHOST, PGDATABASE, PGUSER and
    # PGPASSWORD. Explicit DB_* variables remain supported for other
    # managed MySQL/PostgreSQL providers.
    url: "${DB_URL:jdbc:postgresql://${PGHOST}:5432/${PGDATABASE}?sslmode=require}"
    username: "${DB_USERNAME:${PGUSER}}"
    password: "${DB_PASSWORD:${PGPASSWORD}}"
    hikari:
      initialization-fail-timeout: -1
  data:
    jpa:
      repositories:
        bootstrap-mode: lazy
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: false
  h2:
    console:
      enabled: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

google:
  maps:
    api:
      url: ${GOOGLE_MAPS_API_URL:https://maps.googleapis.com}
      path: ${GOOGLE_MAPS_API_PATH:/maps/api/geocode/json}
      key: ${GOOGLE_MAPS_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

localidade:
  pendente:
    reprocessamento:
      enabled: ${LOCALIDADE_PENDENTE_REPROCESSAMENTO_ENABLED:false}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
