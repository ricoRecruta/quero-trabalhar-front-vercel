# Config do nginx para o container "tudo junto" (front + backend no mesmo
# container, comunicando por localhost).
#
# Diferente de docker/nginx.conf.template (usado quando front e backend são
# containers separados), aqui o backend é sempre 127.0.0.1:8080 — é um IP
# literal, não um hostname, então o nginx não precisa da resolução de DNS por
# requisição (resolver + variável) que o cenário multi-container exige: ele
# consegue abrir a config e iniciar mesmo que o Java ainda esteja subindo,
# porque não há DNS nenhum a resolver, só uma conexão TCP que ele tenta a
# cada requisição.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/xml;

    # ------------------------------------------------------------------
    # Backend (Spring Boot na branch jefferson-experimental), no mesmo
    # container, ouvindo em 127.0.0.1:8080.
    # ------------------------------------------------------------------
    location /login {
        proxy_pass http://127.0.0.1:8080;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location /v3/api-docs {
        proxy_pass http://127.0.0.1:8080;
    }

    location /swagger-ui {
        proxy_pass http://127.0.0.1:8080;
    }

    # Console do H2, útil para inspecionar os dados durante o teste.
    # JDBC URL: jdbc:h2:mem:querotrabalhar-local  |  usuário: sa  |  senha: (vazio)
    location /h2-console {
        proxy_pass http://127.0.0.1:8080;
    }

    # ------------------------------------------------------------------
    # Arquivos estáticos do build
    # ------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SPA: qualquer rota desconhecida devolve o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
