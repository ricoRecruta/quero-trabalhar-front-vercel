# Sobe frontend + backend juntos, num comando só.
#
#   docker compose -f docker-compose.full.yml up --build
#
# Pressupõe que os dois repositórios estão lado a lado:
#   GitHub/
#   ├── quero-trabalhar/        (backend, Spring Boot)
#   └── quero-trabalhar-front/  (este repositório)
#
# Se o backend estiver em outro caminho, ajuste BACKEND_PATH no .env:
#   BACKEND_PATH=../outro/caminho

services:
  quero-trabalhar-api:
    build:
      context: ${BACKEND_PATH:-../quero-trabalhar}
      dockerfile: Dockerfile
    image: quero-trabalhar-api:local
    container_name: quero-trabalhar-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-test}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    networks:
      - quero-trabalhar-net
    restart: unless-stopped

  quero-trabalhar-front:
    build:
      context: .
      dockerfile: Dockerfile
    image: quero-trabalhar-front:local
    container_name: quero-trabalhar-front
    ports:
      - "5173:80"
    environment:
      API_URL: http://quero-trabalhar-api:8080
    depends_on:
      - quero-trabalhar-api
    networks:
      - quero-trabalhar-net
    restart: unless-stopped

networks:
  quero-trabalhar-net:
    name: quero-trabalhar-net
