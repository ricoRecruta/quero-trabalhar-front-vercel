services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JWT_SECRET: ${JWT_SECRET:-cXVlcm8tdHJhYmFsaGFyLWxvY2FsLWFuZC10ZXN0LWp3dC1zZWNyZXQtd2l0aC1sZWFzdC1zaXh0eS1mb3VyLWJ5dGVzLTIwMjY=}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-dev-google-maps-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
    restart: unless-stopped
